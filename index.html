<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Responsive Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🎨 Design Fun</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section class="hero">
            <h1>Welcome to Layout Land! 🎪</h1>
            <p>Where boxes align and space is divine!</p>
        </section>

        <section class="grid-showcase">
            <div class="card">🎯 Feature 1</div>
            <div class="card">🚀 Feature 2</div>
            <div class="card">✨ Feature 3</div>
            <div class="card">🎪 Feature 4</div>
        </section>

        <section class="flex-content">
            <div class="content-box">
                <h2>🌟 Left Content</h2>
                <p>Flexbox making things flexible!</p>
            </div>
            <div class="content-box">
                <h2>✨ Right Content</h2>
                <p>Watch how this adjusts on mobile!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Made with 💖 and CSS Magic</p>
    </footer>
</body>
</html>
